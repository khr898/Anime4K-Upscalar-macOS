name: Build and Release
run-name: Release ${{ github.event.release.tag_name || github.ref_name }}
on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select latest stable Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install latest dependencies
      run: |
        # The bundler (Anime4K-Upscaler/Scripts/bundle_dependencies.sh) builds
        # ffmpeg FROM SOURCE against the Homebrew libplacebo + dav1d headers and
        # copies the libplacebo + MoltenVK bottles into the app bundle. Those
        # bottles MUST be the latest: libplacebo 360.0 had a custom_shader
        # color-patch bug fixed in 360.1; MoltenVK must match the Vulkan ABI.
        # `brew install` alone is a no-op when a package is already present at
        # an older version (the macos-latest runner ships pre-installed bottles),
        # so `brew update` + `brew upgrade` are required to guarantee the newest
        # bottles reach the bundle. The bundler re-runs `brew upgrade` during the
        # xcodebuild script phase too — belt and suspenders.
        #   libplacebo : shader dispatch (color-patch fix lives in the 360.1 bottle)
        #   molten-vk  : Vulkan-on-Metal for libplacebo + ncnn
        #   dav1d      : provides libdav1d, the software AV1 decoder (ffmpeg --enable-libdav1d)
        #   pkg-config : ffmpeg configure finds libplacebo/dav1d via pkg-config
        #   xcodegen   : regenerates the Xcode project from project.yml
        brew update
        brew install libplacebo molten-vk dav1d pkg-config xcodegen
        brew upgrade libplacebo molten-vk dav1d
        echo "libplacebo: $(brew list --versions libplacebo)"
        echo "molten-vk:  $(brew list --versions molten-vk)"
        echo "dav1d:      $(brew list --versions dav1d)"

    - name: Enforce dependency version rules
      run: |
        LP_VER=$(brew list --versions libplacebo | awk '{print $2}')
        MVK_VER=$(brew list --versions molten-vk | awk '{print $2}')
        if [[ -z "$LP_VER" ]]; then
          echo "error: libplacebo is not installed via Homebrew."
          exit 1
        fi
        if [[ "$LP_VER" == 7.360.0* || "$LP_VER" == [0-6].* || "$LP_VER" == 7.[0-3][0-5][0-9].* ]]; then
          echo "error: libplacebo version $LP_VER is below required 7.360.1 (color patch fix missing)."
          exit 1
        fi
        if [[ -z "$MVK_VER" ]]; then
          echo "error: molten-vk is not installed via Homebrew."
          exit 1
        fi
        if [[ "$MVK_VER" == 1.[0-3].* || "$MVK_VER" == 1.4.[0-1] || "$MVK_VER" == 0.* ]]; then
          echo "error: molten-vk version $MVK_VER is below required 1.4.2."
          exit 1
        fi
        echo "✅ Dependency versions verified: libplacebo=$LP_VER, molten-vk=$MVK_VER"

    - name: Resolve release tag and version
      id: get_version
      run: |
        TAG_FROM_RELEASE="${{ github.event.release.tag_name || '' }}"
        TAG_FROM_REF="${{ github.ref_name }}"

        if [[ -n "$TAG_FROM_RELEASE" ]]; then
          RAW_TAG="$TAG_FROM_RELEASE"
          if [[ -n "$TAG_FROM_REF" && "$TAG_FROM_REF" != "$TAG_FROM_RELEASE" ]]; then
            echo "error: ref tag ($TAG_FROM_REF) does not match release tag ($TAG_FROM_RELEASE)"
            exit 1
          fi
        else
          RAW_TAG="$TAG_FROM_REF"
        fi

        if [[ -z "$RAW_TAG" ]]; then
          echo "error: unable to resolve release tag"
          exit 1
        fi

        echo "RAW_TAG=$RAW_TAG" >> "$GITHUB_ENV"
        echo "VERSION=${RAW_TAG#v}" >> "$GITHUB_ENV"

    - name: Update version number
      run: |
        sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: ${{ env.VERSION }}/" project.yml

    - name: Generate Xcode project
      run: xcodegen

    - name: Build Xcode project
      run: |
        A4K_SKIP_ADHOC_SIGNING=1 xcodebuild build \
          -scheme "Anime4K-Upscaler" \
          -project "Anime4K-Upscaler.xcodeproj" \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_ENTITLEMENTS="" \
          ENABLE_HARDENED_RUNTIME=NO \
          EXCLUDED_SOURCE_FILE_NAMES="phase4_aahq_benchmark.swift" \
          SYMROOT=build

    - name: Normalize app signatures
      run: |
        APP_PATH="build/Release/Anime4K Upscaler.app"

        if [[ ! -d "$APP_PATH" ]]; then
          echo "Expected app bundle not found at: $APP_PATH"
          exit 1
        fi

        FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
        if [[ -d "$FRAMEWORKS_DIR" ]]; then
          while IFS= read -r -d '' item; do
            codesign --remove-signature "$item" 2>/dev/null || true
          done < <(find "$FRAMEWORKS_DIR" -type f \( -name "*.dylib" -o -name "ffmpeg" -o -name "ffprobe" \) -print0)
        fi
        codesign --remove-signature "$APP_PATH" 2>/dev/null || true

        # Re-sign with ad-hoc identity so the bundle remains non-notarized but launchable.
        codesign --force --deep --sign - --timestamp=none "$APP_PATH"

    - name: Validate app signature state
      run: |
        APP_PATH="build/Release/Anime4K Upscaler.app"

        SIGN_INFO="$(codesign -dv "$APP_PATH" 2>&1 || true)"

        TEAM_ID="$(printf '%s\n' "$SIGN_INFO" | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
        if [[ "$TEAM_ID" != "not set" ]]; then
          echo "error: expected ad-hoc TeamIdentifier 'not set', got '${TEAM_ID:-<none>}'"
          exit 1
        fi

        SIGNING_AUTHORITY="$(printf '%s\n' "$SIGN_INFO" | awk -F= '/^Authority=/{print $2; exit}')"
        if [[ -n "$SIGNING_AUTHORITY" && "$SIGNING_AUTHORITY" != "-" ]]; then
          echo "error: expected ad-hoc signing authority when present, got '$SIGNING_AUTHORITY'"
          exit 1
        fi

        if spctl --assess --type execute -vv "$APP_PATH"; then
          echo "warning: app unexpectedly passed Gatekeeper assessment"
        else
          echo "Gatekeeper assessment rejected as expected for non-notarized build."
        fi

    - name: Create DMG
      run: |
        APP_PATH="build/Release/Anime4K Upscaler.app"
        DMG_PATH="build/Anime4K_Upscaler_${{ env.RAW_TAG }}_arm64.dmg"

        mkdir -p build/dmg
        cp -R "$APP_PATH" build/dmg/
        ln -s /Applications build/dmg/Applications

        hdiutil create \
          -volname "Anime4K Upscaler ${{ env.VERSION }}" \
          -srcfolder build/dmg \
          -ov -format UDZO \
          "$DMG_PATH"

        echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

    - name: Validate bundled runtime dependencies
      run: |
        FRAMEWORKS_DIR="build/Release/Anime4K Upscaler.app/Contents/Frameworks"
        REQUIRED=(
          "ffmpeg"
          "ffprobe"
          "libMoltenVK.dylib"
        )

        for item in "${REQUIRED[@]}"; do
          if [[ ! -f "$FRAMEWORKS_DIR/$item" ]]; then
            echo "error: missing bundled dependency: $item"
            exit 1
          fi
        done

        echo "Bundled runtime dependency check passed."

    - name: Validate bundled FFmpeg libplacebo support
      run: |
        FRAMEWORKS_DIR="build/Release/Anime4K Upscaler.app/Contents/Frameworks"
        BUNDLED_FFMPEG="$FRAMEWORKS_DIR/ffmpeg"

        if [[ ! -x "$BUNDLED_FFMPEG" ]]; then
          echo "error: bundled ffmpeg is missing or not executable"
          exit 1
        fi

        PLACEBO_SONAME=$(otool -L "$BUNDLED_FFMPEG" | sed -n 's/.*libplacebo\.\([0-9][0-9]*\)\.dylib.*/\1/p' | head -1)
        if [[ -z "$PLACEBO_SONAME" ]]; then
          echo "error: bundled ffmpeg is not linked against libplacebo (no ABI found)"
          exit 1
        fi

        PLACEBO_DYLIB="$(ls "$FRAMEWORKS_DIR"/libplacebo.*.dylib 2>/dev/null | head -1)"
        if [[ -z "$PLACEBO_DYLIB" ]]; then
          echo "error: bundled libplacebo dylib not found in app Frameworks"
          exit 1
        fi

        # The bundled libplacebo must be the SAME bottle Homebrew just
        # installed/upgraded (libplacebo 360.0 had a custom_shader color-patch
        # bug fixed in 360.1). Soname is 360 across both, so the ABI check above
        # can't distinguish stale from fresh. Assert the bundled dylib's size
        # matches the Homebrew bottle's size (the bundler relinks the id, which
        # can shift a few bytes, so allow a small delta) and that it was copied
        # during this build (mtime within the last 10 minutes — a stale cached
        # copy from a prior local build would be older).
        HOMEBREW_LP="$(brew --prefix libplacebo 2>/dev/null)/lib/libplacebo.${PLACEBO_SONAME}.dylib"
        if [[ -f "$HOMEBREW_LP" ]]; then
          HOME_SIZE=$(stat -f%z "$HOMEBREW_LP")
          BUND_SIZE=$(stat -f%z "$PLACEBO_DYLIB")
          SIZE_DELTA=$(( BUND_SIZE > HOME_SIZE ? BUND_SIZE - HOME_SIZE : HOME_SIZE - BUND_SIZE ))
          if (( SIZE_DELTA > 4096 )); then
            echo "error: bundled libplacebo size ($BUND_SIZE) differs from Homebrew bottle ($HOME_SIZE) by $SIZE_DELTA bytes — likely a stale bottle. Expected the latest 360.1 bottle."
            echo "   homebrew: $(brew list --versions libplacebo)"
            exit 1
          fi
          echo "libplacebo size check passed (homebrew=$HOME_SIZE, bundled=$BUND_SIZE, delta=$SIZE_DELTA)."
        else
          echo "warning: could not locate Homebrew libplacebo bottle to compare size."
        fi

        # Freshness: the bundler must have copied/relabeled the dylib this build.
        NOW=$(date +%s)
        MTIME=$(stat -f%m "$PLACEBO_DYLIB")
        AGE=$(( NOW - MTIME ))
        if (( AGE > 600 )); then
          echo "error: bundled libplacebo dylib is $AGE seconds old — not refreshed this build. The copy_dylibs_recursive refresh guard may have failed to pull the latest bottle."
          exit 1
        fi
        echo "libplacebo freshness check passed (copied ${AGE}s ago)."

        echo "Bundled FFmpeg libplacebo check passed (ABI ${PLACEBO_SONAME}, homebrew $(brew list --versions libplacebo))."

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RAW_TAG }}
        name: Anime4K Upscaler ${{ env.RAW_TAG }}
        files: ${{ env.DMG_PATH }}
        overwrite_files: true
        append_body: true
        body: >-
          This release is not Developer ID signed and not notarized. On first launch, macOS Gatekeeper may block it; allow it from System Settings > Privacy and Security by clicking Open Anyway, or use Finder right-click Open once.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}